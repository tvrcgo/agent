name: AI
services:
  agent:
    build: .
    container_name: agent
    ports:
      - "8765:8765"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./data/sessions:/app/data/sessions
      - ./workspace:/app/workspace
      - ./skills:/app/skills
    restart: unless-stopped
