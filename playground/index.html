<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Playground</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #fff;
    --border: #e0e0e0;
    --text: #333;
    --muted: #999;
    --accent: #5b5fe3;
    --thinking: #7c3aed;
    --tool: #2563eb;
    --result: #059669;
    --message: #d97706;
    --confirm: #ea580c;
    --error: #dc2626;
    --status: #94a3b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; font-weight: 600; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.connected { background: #34d399; }
  .status-dot.disconnected { background: #f87171; }
  .session-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .session-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    width: 180px;
  }
  .session-row button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .session-row button:hover { color: var(--text); border-color: var(--muted); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .event {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 13px;
  }
  .event .label {
    flex-shrink: 0;
    min-width: 72px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    padding-top: 2px;
  }
  .event.thinking .label { color: var(--thinking); }
  .event.tool_call .label { color: var(--tool); }
  .event.tool_result .label { color: var(--result); }
  .event.message .label { color: var(--message); }
  .event.confirm .label { color: var(--confirm); }
  .event.error .label { color: var(--error); }
  .event.status { background: transparent; border-color: transparent; }
  .event.status .label { color: var(--status); }
  .event.you { background: #dbeafe; border-color: #bfdbfe; justify-content: flex-end; }
  .event.you .label { color: var(--muted); min-width: auto; }
  .event .body { flex: 1; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .event .body p { margin: 4px 0; }
  .event .body p:first-child { margin-top: 0; }
  .event .body p:last-child { margin-bottom: 0; }
  .event .body ul, .event .body ol { padding-left: 20px; margin: 4px 0; }
  .event .body li { margin: 2px 0; }
  .event .body pre {
    background: var(--bg);
    padding: 8px 12px;
    border-radius: 4px;
    overflow-x: auto;
    margin: 4px 0;
    font-family: inherit;
    font-size: 12px;
  }
  .event .body code {
    background: rgba(0,0,0,0.06);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
  }
  .event.confirm .actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .event.confirm .actions button {
    padding: 6px 16px;
    border-radius: 4px;
    border: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .event.confirm .actions .approve {
    background: #16a34a;
    color: #fff;
  }
  .event.confirm .actions .deny {
    background: var(--error);
    color: #fff;
  }
  .event.confirm .actions button:hover { opacity: 0.85; }
  footer {
    padding: 0 24px 22px;
    background: transparent;
    display: flex;
    gap: 8px;
    align-items: center;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  footer input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 24px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  footer input:focus { border-color: var(--accent); box-shadow: 0 2px 16px rgba(91,95,227,0.15); }
  footer button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 24px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  footer button.cmd {
    background: var(--surface);
    border: 1px solid var(--border);
    font-weight: 400;
    color: var(--muted);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  footer button.cmd:hover { color: var(--text); border-color: var(--muted); }
  footer button:hover { opacity: 0.9; }
  footer button:disabled { opacity: 0.4; cursor: default; }
  .popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
  }
  .popup-overlay.show { display: block; }
  .popup-menu {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    animation: slideUp 0.15s ease-out;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .popup-menu button {
    background: transparent;
    border: none;
    color: var(--text);
    padding: 10px 20px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }
  .popup-menu button:hover { background: var(--bg); }
  .empty-state {
    color: var(--muted);
    text-align: center;
    margin-top: 60px;
    font-size: 13px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="container">

<header>
  <h1><span class="status-dot disconnected" id="status-dot"></span> Agent Playground</h1>
  <div class="session-row">
    <label for="session-id">session:</label>
    <input id="session-id" type="text" placeholder="auto-generated">
    <button id="reset-session-btn" title="New session">+</button>
  </div>
</header>

<main id="log">
  <div class="empty-state">
    Connected to <code id="ws-url-display">ws://127.0.0.1:8765</code><br>
    Send a message to start.
  </div>
</main>

<footer>
  <input id="input" type="text" placeholder="Type a message..." autofocus>
  <button id="send-btn" disabled>Send</button>
  <button id="more-btn" disabled class="cmd">&ctdot;</button>
</footer>

<div class="popup-overlay" id="popup-overlay">
  <div class="popup-menu" id="popup-menu">
    <button id="cancel-btn" disabled>Cancel</button>
    <button id="compress-btn" disabled>Compress</button>
  </div>
</div>

<script>
const WS_URL = 'ws://127.0.0.1:8765';
let ws = null;

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

const $status = document.getElementById('status-dot');
const $log = document.getElementById('log');
const $input = document.getElementById('input');
const $sendBtn = document.getElementById('send-btn');
const $cancelBtn = document.getElementById('cancel-btn');
const $compressBtn = document.getElementById('compress-btn');
const $moreBtn = document.getElementById('more-btn');
const $popupOverlay = document.getElementById('popup-overlay');
const $sessionId = document.getElementById('session-id');
const $urlDisplay = document.getElementById('ws-url-display');

const LS_KEY = 'playground_session_id';

$urlDisplay.textContent = WS_URL;
$sessionId.value = localStorage.getItem(LS_KEY) || uuid();
localStorage.setItem(LS_KEY, $sessionId.value);

function resetSession() {
  const id = uuid();
  $sessionId.value = id;
  localStorage.setItem(LS_KEY, id);
  if (ws) { ws.close(); }
}

function connect() {
  const sid = $sessionId.value.trim();
  const url = sid ? `${WS_URL}?session_id=${encodeURIComponent(sid)}` : WS_URL;

  try {
    ws = new WebSocket(url);
  } catch (e) {
    setStatus(false);
    return;
  }

  ws.onopen = () => {
    setStatus(true);
    $sendBtn.disabled = false;
    $cancelBtn.disabled = false;
    $compressBtn.disabled = false;
    $moreBtn.disabled = false;
    addEvent('status', 'Connected' + (sid ? ` (session: ${sid})` : ''));
    $input.focus();
  };

  ws.onclose = () => {
    setStatus(false);
    $sendBtn.disabled = true;
    $cancelBtn.disabled = true;
    $compressBtn.disabled = true;
    $moreBtn.disabled = true;
    $popupOverlay.classList.remove('show');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {};

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    const type = msg.type;
    const p = msg.payload || {};

    switch (type) {
      case 'tool_call':
        if (p.name === 'request_confirmation') {
          addConfirm(p.id, (p.arguments || {}).description || 'Proceed?');
        } else {
          addEvent('tool_call', `${p.name}(${JSON.stringify(p.arguments || {})})`);
        }
        break;
      case 'tool_result':
        addEvent('tool_result', formatResult(p.result, p.error));
        break;
      case 'message':
        addEvent('message', p.content || '');
        break;
      case 'error':
        addEvent('error', `[${p.code}] ${p.message}`);
        break;
      case 'status':
        if (p.content) {
          addEvent('thinking', p.content);
        } else {
          addEvent('status', p.status);
        }
        if (p.status === 'done') $input.focus();
        break;
      default:
        addEvent('status', JSON.stringify(msg));
    }
  };
}

function setStatus(connected) {
  $status.className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
}

const MD_TYPES = new Set(['message', 'thinking']);

function addEvent(type, content) {
  const el = document.createElement('div');
  el.className = `event ${type}`;
  const body = MD_TYPES.has(type) ? marked.parse(content) : escapeHtml(content);
  el.innerHTML = `<span class="label">${type}</span><div class="body">${body}</div>`;
  $log.appendChild(el);
  $log.scrollTop = $log.scrollHeight;
}

function addConfirm(id, description) {
  const el = document.createElement('div');
  el.className = 'event confirm';
  el.innerHTML = `
    <span class="label">confirm</span>
    <div class="body">
      ${escapeHtml(description)}
      <div class="actions">
        <button class="approve" data-id="${id}" data-decision="approve">Approve</button>
        <button class="deny" data-id="${id}" data-decision="deny">Deny</button>
      </div>
    </div>`;
  el.querySelector('.approve').addEventListener('click', onConfirm);
  el.querySelector('.deny').addEventListener('click', onConfirm);
  $log.appendChild(el);
  $log.scrollTop = $log.scrollHeight;
}

function onConfirm(e) {
  const btn = e.target;
  const id = btn.dataset.id;
  const decision = btn.dataset.decision;
  ws.send(JSON.stringify({
    type: 'command',
    payload: { action: 'confirm', confirm_id: id, decision }
  }));
  const actions = btn.parentElement.querySelectorAll('button');
  actions.forEach(b => b.disabled = true);
  addEvent('you', `${decision} confirm`);
}

function formatResult(result, error) {
  if (error) return `ERROR: ${error}`;
  const s = String(result || '');
  return s.length > 500 ? s.slice(0, 500) + '...' : s;
}

function escapeHtml(s) {
  const el = document.createElement('div');
  el.textContent = s;
  return el.innerHTML;
}

function send() {
  const text = $input.value.trim();
  if (!text) return;

  if (text.startsWith('/')) {
    const action = text.slice(1).split(' ')[0];
    ws.send(JSON.stringify({ type: 'command', payload: { action } }));
    addEvent('you', `/${action}`);
  } else {
    ws.send(JSON.stringify({ type: 'chat', payload: { content: text } }));
    addEvent('you', text);
  }

  $input.value = '';
  $input.focus();
}

function sendCommand(action) {
  ws.send(JSON.stringify({ type: 'command', payload: { action } }));
  addEvent('you', `/${action}`);
  $popupOverlay.classList.remove('show');
}

$moreBtn.addEventListener('click', () => {
  const show = !$popupOverlay.classList.contains('show');
  if (show) {
    const btnRect = $moreBtn.getBoundingClientRect();
    const menu = document.getElementById('popup-menu');
    menu.style.right = (window.innerWidth - btnRect.right) + 'px';
    menu.style.bottom = (window.innerHeight - btnRect.top + 8) + 'px';
  }
  $popupOverlay.classList.toggle('show');
});
$popupOverlay.addEventListener('click', (e) => {
  if (e.target === $popupOverlay) $popupOverlay.classList.remove('show');
});

$sendBtn.addEventListener('click', send);
$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});
document.getElementById('cancel-btn').addEventListener('click', () => sendCommand('cancel'));
document.getElementById('compress-btn').addEventListener('click', () => sendCommand('compress'));
$sessionId.addEventListener('change', () => {
  localStorage.setItem(LS_KEY, $sessionId.value.trim());
  if (ws) { ws.close(); }
});
document.getElementById('reset-session-btn').addEventListener('click', resetSession);

connect();
</script>

</div>
</body>
</html>
