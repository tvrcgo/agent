<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Playground</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --border: #2a2a4a;
    --text: #e0e0e0;
    --muted: #888;
    --accent: #7c83ff;
    --thinking: #a78bfa;
    --tool: #60a5fa;
    --result: #34d399;
    --message: #fbbf24;
    --error: #f87171;
    --status: #94a3b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    max-width: 820px;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; font-weight: 600; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.connected { background: #34d399; }
  .status-dot.disconnected { background: #f87171; }
  .session-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .session-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    width: 160px;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .event {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 13px;
  }
  .event .label {
    flex-shrink: 0;
    min-width: 72px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    padding-top: 2px;
  }
  .event.thinking .label { color: var(--thinking); }
  .event.tool_call .label { color: var(--tool); }
  .event.tool_result .label { color: var(--result); }
  .event.message .label { color: var(--message); }
  .event.error .label { color: var(--error); }
  .event.status .label { color: var(--status); }
  .event .body { flex: 1; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .event .body code {
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
  }
  footer {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  footer input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  footer input:focus { border-color: var(--accent); }
  footer button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  footer button.cmd {
    background: var(--surface);
    border: 1px solid var(--border);
    font-weight: 400;
    color: var(--muted);
  }
  footer button.cmd:hover { color: var(--text); border-color: var(--muted); }
  footer button:hover { opacity: 0.9; }
  footer button:disabled { opacity: 0.4; cursor: default; }
  footer select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 8px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .empty-state {
    color: var(--muted);
    text-align: center;
    margin-top: 60px;
    font-size: 13px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="container">

<header>
  <h1><span class="status-dot disconnected" id="status-dot"></span> Agent Playground</h1>
  <div class="session-row">
    <label for="session-id">session:</label>
    <input id="session-id" type="text" placeholder="auto-generated" value="playground">
  </div>
</header>

<main id="log">
  <div class="empty-state">
    Connected to <code id="ws-url-display">ws://127.0.0.1:8765</code><br>
    Send a message to start.
  </div>
</main>

<footer>
  <input id="input" type="text" placeholder="Type a message..." autofocus>
  <button id="send-btn" disabled>Send</button>
  <button id="cancel-btn" disabled class="cmd">Cancel</button>
  <button id="compress-btn" disabled class="cmd">Compress</button>
</footer>

<script>
const WS_URL = 'ws://127.0.0.1:8765';
let ws = null;

const $status = document.getElementById('status-dot');
const $log = document.getElementById('log');
const $input = document.getElementById('input');
const $sendBtn = document.getElementById('send-btn');
const $cancelBtn = document.getElementById('cancel-btn');
const $compressBtn = document.getElementById('compress-btn');
const $sessionId = document.getElementById('session-id');
const $urlDisplay = document.getElementById('ws-url-display');

$urlDisplay.textContent = WS_URL;

function connect() {
  const sid = $sessionId.value.trim();
  const url = sid ? `${WS_URL}?session_id=${encodeURIComponent(sid)}` : WS_URL;

  try {
    ws = new WebSocket(url);
  } catch (e) {
    setStatus(false);
    return;
  }

  ws.onopen = () => {
    setStatus(true);
    $sendBtn.disabled = false;
    $cancelBtn.disabled = false;
    $compressBtn.disabled = false;
    addEvent('status', 'Connected' + (sid ? ` (session: ${sid})` : ''));
    $input.focus();
  };

  ws.onclose = () => {
    setStatus(false);
    $sendBtn.disabled = true;
    $cancelBtn.disabled = true;
    $compressBtn.disabled = true;
    addEvent('status', 'Disconnected — reconnecting in 2s...');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {}; // onclose will fire

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    const type = msg.type;
    const p = msg.payload || {};

    switch (type) {
      case 'thinking':
        addEvent('thinking', p.content || '');
        break;
      case 'tool_call':
        addEvent('tool_call', `${p.name}(${JSON.stringify(p.arguments || {})})`);
        break;
      case 'tool_result':
        addEvent('tool_result', formatResult(p.result, p.error));
        break;
      case 'message':
        addEvent('message', p.content || '');
        break;
      case 'error':
        addEvent('error', `[${p.code}] ${p.message}`);
        break;
      case 'status':
        addEvent('status', p.state);
        if (p.state === 'done') $input.focus();
        break;
      default:
        addEvent('status', JSON.stringify(msg));
    }
  };
}

function setStatus(connected) {
  $status.className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
}

function addEvent(type, content) {
  const el = document.createElement('div');
  el.className = `event ${type}`;
  el.innerHTML = `<span class="label">${type}</span><div class="body">${escapeHtml(content)}</div>`;
  $log.appendChild(el);
  $log.scrollTop = $log.scrollHeight;
}

function formatResult(result, error) {
  if (error) return `ERROR: ${error}`;
  const s = String(result || '');
  return s.length > 500 ? s.slice(0, 500) + '...' : s;
}

function escapeHtml(s) {
  const el = document.createElement('div');
  el.textContent = s;
  return el.innerHTML;
}

function send() {
  const text = $input.value.trim();
  if (!text) return;
  ws.send(JSON.stringify({ type: 'chat', payload: { content: text } }));
  addEvent('status', `→ ${text}`);
  $input.value = '';
  $input.focus();
}

function sendCommand(action) {
  ws.send(JSON.stringify({ type: 'command', payload: { action } }));
  addEvent('status', `→ ${action}`);
}

$sendBtn.addEventListener('click', send);
$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});
document.getElementById('cancel-btn').addEventListener('click', () => sendCommand('cancel'));
document.getElementById('compress-btn').addEventListener('click', () => sendCommand('compress'));
$sessionId.addEventListener('change', () => {
  if (ws) { ws.close(); }
});

connect();
</script>

</div>
</body>
</html>
