model:
  provider: openai
  name: deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key: ${DEEPSEEK_API_KEY}

agent:
  max_concurrent_sessions: 10
  max_iterations: 100
  max_load_messages: 100
  max_tokens: 128000
  compress_threshold: 0.9
  compress_keep_recent: 10

ws:
  host: 0.0.0.0
  port: 8765

skills:
  - websearch
  - confirm

plugins:
  - session
  - confirm
