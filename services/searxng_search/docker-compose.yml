name: agent-services

services:
  searxng_search:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - agent
    restart: unless-stopped

networks:
  agent:
    external: true
    name: agent