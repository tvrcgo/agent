mcp:
  servers:
    filesystem:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
      tools: ["read_file", "write_file", "list_directory"]
    memory:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-memory", "/workspace"]

